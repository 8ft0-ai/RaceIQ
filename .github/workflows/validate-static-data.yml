name: Validate static data

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Offline blocked-data integrity checks pin an ancestor commit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse core JSON files
        run: |
          python -m json.tool data/grid_to_finish.json > /dev/null
          python -m json.tool data/grid_to_finish_validation.json > /dev/null
          if [ -f data/team_report_cards.json ]; then python -m json.tool data/team_report_cards.json > /dev/null; fi
          if [ -f data/team_report_cards_validation.json ]; then python -m json.tool data/team_report_cards_validation.json > /dev/null; fi

      - name: Check blocked analytics or regenerate legacy report cards
        run: |
          if [ -f data/timing_anomaly_integrity.json ]; then
            # Fail closed: do not reinstate scores blocked by the source authority.
            python tools/block_timing_anomaly.py --check
          else
            python tools/generate_team_report_cards.py --dry-run
            python tools/generate_team_report_cards.py
          fi

      - name: Validate generated static data
        run: python tools/validate_static_data.py

      - name: Run RaceIQ static app smoke validator
        run: python tools/validate_static_app.py

      - name: Verify prepared JSON remains deterministic
        run: git diff --exit-code -- data/

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check report-cards.js
          node --check dashboard-enhancements.js
          node --check team-comparison.js
          node --check tests/team-comparison-browser.cjs

      - name: Install test-only Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Real browser comparison and regression acceptance
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/raceiq-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          node tests/team-comparison-browser.cjs
